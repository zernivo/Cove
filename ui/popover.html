<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Menu</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/chrome.css" />
    <link rel="stylesheet" href="./src/popover.css" />
  </head>
  <body>
    <!-- One popover at a time; the window is sized to exactly this element. -->

    <!-- The Cove menu, like the Apple menu. -->
    <div class="menu hidden" id="menu" role="menu">
      <button data-cove="about">About Cove</button>
      <hr />
      <button data-cove="settings">Cove Settings…</button>
      <button data-cove="wallpaper">Wallpaper…</button>
      <hr />
      <button data-cove="desktop-off">Turn Cove Desktop Off</button>
      <hr />
      <button data-cove="lock">Lock Screen <kbd>Win L</kbd></button>
      <button data-cove="sleep">Sleep</button>
      <button data-cove="restart">Restart…</button>
      <button data-cove="shutdown">Shut Down…</button>
      <hr />
      <button data-cove="quit">Quit Cove</button>
    </div>

    <!-- The app menu: the app in front. -->
    <div class="menu hidden" id="appmenu" role="menu"></div>

    <!-- Asked before Restart / Shut down when Windows can't ask itself. -->
    <div class="menu confirm hidden" id="confirm" role="alertdialog">
      <p id="confirm-text"></p>
      <div class="confirm-row"><button id="confirm-no">Cancel</button><button class="primary" id="confirm-yes"></button></div>
    </div>

    <!-- Control Centre. -->
    <div class="cc hidden" id="cc">
      <div class="row">
        <div class="module stack">
          <button class="tog" id="t-wifi" title="Wi-Fi settings">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" /><circle cx="12" cy="19.2" r="0.6" /></svg></span>
            <span class="lab"><b>Wi-Fi</b><small id="wifi-name">…</small></span>
          </button>
          <button class="tog" id="t-bt" title="Bluetooth settings">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17" /></svg></span>
            <span class="lab"><b>Bluetooth</b><small>Settings</small></span>
          </button>
        </div>
        <div class="col">
          <button class="module tog" id="t-focus" title="Focus settings">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg></span>
            <span class="lab"><b>Focus</b><small>Settings</small></span>
          </button>
          <button class="module tog" id="t-dark" title="Dark mode">
            <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 4v16a8 8 0 0 0 0-16z" class="solid" /></svg></span>
            <span class="lab"><b>Dark mode</b><small id="dark-state">Off</small></span>
          </button>
        </div>
      </div>

      <div class="module slider-mod" id="bright-card">
        <div class="head"><b>Display</b><button class="link" id="t-night">Night light</button></div>
        <div class="slider" id="bright-slider">
          <span class="fill"></span><span class="knob"></span>
          <span class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" /><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4" /></svg></span>
          <input type="range" id="bright" min="0" max="100" aria-label="Display brightness" />
        </div>
      </div>

      <div class="module slider-mod" id="vol-card">
        <div class="head"><b>Sound</b><button class="link" id="t-sound">Sound settings <span aria-hidden="true">›</span></button></div>
        <div class="slider" id="vol-slider">
          <span class="fill"></span><span class="knob"></span>
          <button class="glyph mute" id="mute" title="Mute"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6" /><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" /></svg></button>
          <input type="range" id="vol" min="0" max="100" aria-label="Volume" />
        </div>
      </div>

      <div class="foot">
        <button class="link" data-go="control">Windows Quick Settings…</button>
        <button class="link" data-go="display">Display settings</button>
      </div>
    </div>

    <script type="module" src="./src/popover.ts"></script>
  </body>
</html>
