<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Menu</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/chrome.css" />
    <link rel="stylesheet" href="./src/popover.css" />
  </head>
  <body>
    <!-- One popover at a time. The window is sized (and shaped, with a
         rounded window region) to exactly what's shown: a menu with its
         open submenu, the Restart / Shut Down confirmation, or Control Centre. -->
    <div class="stage" id="stage">
      <div class="menu hidden" id="menu" role="menu"></div>
      <div class="menu sub hidden" id="sub" role="menu"></div>

      <div class="menu confirm hidden" id="confirm" role="alertdialog" aria-modal="true" aria-describedby="confirm-text">
        <p id="confirm-text"></p>
        <div class="confirm-row"><button id="confirm-no">Cancel</button><button class="primary" id="confirm-yes"></button></div>
      </div>

      <!-- The clock's calendar (from the dock's status island). -->
      <div class="menu cal hidden" id="cal" role="dialog" aria-label="Calendar">
        <div class="cal-today"><b id="cal-day"></b><small id="cal-date"></small></div>
        <div class="cal-month">
          <span id="cal-title"></span>
          <span class="cal-nav">
            <button id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16"><path d="M9.8 3.6L5.4 8l4.4 4.4" /></svg></button>
            <button id="cal-now" aria-label="This month"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.6" class="solid" /></svg></button>
            <button id="cal-next" aria-label="Next month"><svg viewBox="0 0 16 16"><path d="M6.2 3.6L10.6 8l-4.4 4.4" /></svg></button>
          </span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="foot cal-foot">
          <button class="link" id="cal-notes">Notifications</button>
          <button class="link" id="cal-settings">Date &amp; time settings</button>
        </div>
      </div>

      <div class="cc hidden" id="cc" role="dialog" aria-label="Control Centre">
        <div class="grid">
          <button class="tog" id="t-wifi" title="Wi-Fi settings" aria-describedby="wifi-name">
            <span class="chip" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M1.6 6.1a9.4 9.4 0 0 1 12.8 0" /><path d="M3.9 8.5a6.1 6.1 0 0 1 8.2 0" /><path d="M6.2 10.9a2.8 2.8 0 0 1 3.6 0" /><circle cx="8" cy="13" r="0.9" class="solid" /></svg></span>
            <span class="lab"><b>Wi-Fi</b><small id="wifi-name">…</small></span>
          </button>
          <button class="tog" id="t-bt" title="Bluetooth settings" aria-describedby="bt-state">
            <span class="chip" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.6 4.9l6.6 6.2L8 14V2l3.2 2.9-6.6 6.2" /></svg></span>
            <span class="lab"><b>Bluetooth</b><small id="bt-state">…</small></span>
          </button>
          <button class="tog" id="t-focus" title="Focus (Do not disturb) settings" aria-describedby="focus-state">
            <span class="chip" aria-hidden="true"><svg viewBox="0 0 16 16"><path class="solid" d="M13.4 9.8A5.9 5.9 0 0 1 6.2 2.6a5.9 5.9 0 1 0 7.2 7.2z" /></svg></span>
            <span class="lab"><b>Focus</b><small id="focus-state">…</small></span>
          </button>
          <button class="tog" id="t-dark" title="Dark mode" role="switch" aria-checked="false">
            <span class="chip" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" /><path class="solid" d="M8 2.4v11.2a5.6 5.6 0 0 0 0-11.2z" /></svg></span>
            <span class="lab"><b>Dark mode</b><small id="dark-state">…</small></span>
          </button>
        </div>

        <div class="module slider-mod" id="bright-card">
          <div class="head"><b>Display</b><button class="link" id="t-night">Night light</button></div>
          <div class="slider" id="bright-slider">
            <span class="fill"></span>
            <span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.6" /><path d="M8 1.6v1.5M8 12.9v1.5M3.5 3.5l1 1M11.5 11.5l1 1M1.6 8h1.5M12.9 8h1.5M3.5 12.5l1-1M11.5 4.5l1-1" /></svg></span>
            <input type="range" id="bright" min="0" max="100" aria-label="Display brightness" />
          </div>
          <p class="note hidden" id="bright-note">This display sets its own brightness.</p>
        </div>

        <div class="module slider-mod" id="vol-card">
          <div class="head"><b>Sound</b><button class="link" id="t-sound"><span id="device">Sound settings</span></button></div>
          <div class="slider" id="vol-slider">
            <span class="fill"></span>
            <button class="glyph mute" id="mute" title="Mute" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 16 16"><path class="solid" d="M2.2 6h2.3l3.2-2.7v9.4L4.5 10H2.2z" /><path class="waves" d="M10 6.2a2.6 2.6 0 0 1 0 3.6M11.9 4.4a5.2 5.2 0 0 1 0 7.2" /><path class="x" d="M10.2 6.2l3.6 3.6M13.8 6.2l-3.6 3.6" /></svg></button>
            <input type="range" id="vol" min="0" max="100" aria-label="Volume" />
          </div>
        </div>

        <div class="module media hidden" id="media">
          <span class="art" id="media-art" aria-hidden="true"></span>
          <span class="lab"><b id="media-title"></b><small id="media-sub"></small></span>
          <span class="transport">
            <button id="m-prev" title="Previous" aria-label="Previous track"><svg viewBox="0 0 16 16"><path class="solid" d="M7.6 4.2v7.6L2.4 8zM13.6 4.2v7.6L8.4 8z" /></svg></button>
            <button id="m-play" title="Play/Pause" aria-label="Play or pause"><svg viewBox="0 0 16 16"><path class="solid pause" d="M4.6 3.4h2.2v9.2H4.6zM9.2 3.4h2.2v9.2H9.2z" /><path class="solid play" d="M5 3.2l8 4.8-8 4.8z" /></svg></button>
            <button id="m-next" title="Next" aria-label="Next track"><svg viewBox="0 0 16 16"><path class="solid" d="M8.4 4.2v7.6L13.6 8zM2.4 4.2v7.6L7.6 8z" /></svg></button>
          </span>
        </div>

        <!-- Other apps' tray icons (tray-grid.ts). -->
        <div class="hidden" id="tray"></div>

        <div class="foot">
          <button class="link" id="edit-controls">Edit Controls…</button>
          <button class="link" data-go="control">Windows Quick Settings</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/popover.ts"></script>
  </body>
</html>
