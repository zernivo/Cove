<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Search</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/chrome.css" />
    <link rel="stylesheet" href="./src/search.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="field">
        <svg class="mag" viewBox="0 0 22 22" aria-hidden="true"><circle cx="9.3" cy="9.3" r="6.6" /><path d="M14.2 14.2l5.4 5.4" /></svg>
        <input id="q" type="text" placeholder="Search" autocomplete="off" spellcheck="false" autofocus />
        <span class="scope hidden" id="scope"></span>
      </div>
      <ul class="results" id="results"></ul>
      <footer class="foot" id="foot">
        <span class="not-clip"><kbd>↵</kbd> Open</span>
        <span class="not-clip"><kbd>Ctrl ↵</kbd> Show in folder</span>
        <span class="only-clip"><kbd>↵</kbd> Paste</span>
        <span class="only-clip"><kbd>Ctrl ↵</kbd> Copy</span>
        <span><kbd>Tab</kbd> <i id="next-scope">Filter</i></span>
      </footer>
    </div>
    <script type="module" src="./src/search.ts"></script>
  </body>
</html>
