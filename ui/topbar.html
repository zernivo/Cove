<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Top Bar</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/topbar.css" />
  </head>
  <body>
    <div class="bar">
      <div class="left">
        <button class="mark" id="mark" title="Cove">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6.5A7 7 0 1 0 17 17.5" /><rect x="10" y="10" width="4" height="4" rx="1" class="cube" /></svg>
        </button>
        <span class="app" id="app">Cove</span>
      </div>
      <div class="right">
        <button class="pill" id="search" title="Cove Search (Alt+Space)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l4.5 4.5" /></svg>
        </button>
        <button class="pill" id="wifi-btn" title="Wi-Fi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" /><circle cx="12" cy="19.2" r="0.6" /></svg>
        </button>
        <button class="pill" id="vol-btn" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path id="vol-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path id="vol-x" class="hidden" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
        </button>
        <button class="pill" id="control" title="Control Centre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" /><circle cx="16" cy="8" r="2" /><circle cx="8" cy="16" r="2" /></svg>
        </button>
        <button class="pill hidden" id="battery" title="Battery"><span class="batt"><span class="fill" id="batt-fill"></span></span><span id="batt-text"></span></button>
        <button class="pill clock" id="clock" title="Notifications and calendar"></button>
      </div>
    </div>
    <div class="menu hidden" id="menu">
      <button data-go="cove">Open Cove</button>
      <button data-go="search">Cove Search <kbd>Alt Space</kbd></button>
      <hr />
      <button data-go="settings">Windows Settings</button>
      <button data-go="taskmgr">Task Manager</button>
      <hr />
      <button data-go="lock">Lock screen</button>
    </div>
    <div class="panel hidden" id="panel">
      <div class="tiles">
        <button class="tile" id="t-wifi"><span class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" /></svg></span><span><b>Wi-Fi</b><small id="wifi-name">…</small></span></button>
        <button class="tile" id="t-bt"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17" /></svg></span><span><b>Bluetooth</b><small>Settings</small></span></button>
        <button class="tile" id="t-dark"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg></span><span><b>Dark mode</b><small id="dark-state">Off</small></span></button>
        <button class="tile" id="t-night"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg></span><span><b>Night light</b><small>Settings</small></span></button>
      </div>
      <div class="slider-card hidden" id="bright-card">
        <label>Display</label>
        <div class="slide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /></svg><input type="range" id="bright" min="0" max="100" /></div>
      </div>
      <div class="slider-card" id="vol-card">
        <label>Sound</label>
        <div class="slide"><button class="mute" id="mute" title="Mute"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /></svg></button><input type="range" id="vol" min="0" max="100" /></div>
      </div>
      <div class="foot">
        <button data-go="focus">Focus</button>
        <button data-go="control">Windows Quick Settings</button>
      </div>
    </div>
    <script type="module" src="./src/topbar.ts"></script>
  </body>
</html>
