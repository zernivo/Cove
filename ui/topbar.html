<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Top Bar</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/chrome.css" />
    <link rel="stylesheet" href="./src/topbar.css" />
  </head>
  <body>
    <!-- Wallpaper plate: a pre-blurred slice of the desktop picture under the
         Ink tint (a transparent WebView2 window can't blur what's behind it,
         and DWM acrylic falls back to flat grey on a window that is never
         active, which the bar never is). -->
    <div class="plate" id="plate"><img id="plate-img" alt="" /></div>
    <div class="bar">
      <div class="left">
        <button class="mark" id="mark" title="Cove">
          <span class="cove-mark" aria-hidden="true"></span>
        </button>
        <button class="app" id="app" title="App menu">Cove</button>
      </div>
      <div class="right">
        <button class="pill" id="search" title="Cove Search (Alt+Space)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l4.5 4.5" /></svg>
        </button>
        <button class="pill" id="wifi-btn" title="Wi-Fi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" /><circle cx="12" cy="19.2" r="0.6" /></svg>
        </button>
        <button class="pill hidden" id="battery" title="Battery"><span class="batt"><span class="fill" id="batt-fill"></span></span></button>
        <button class="pill" id="control" title="Control Centre (Wi-Fi, sound, display)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="7" rx="3.5" /><rect x="3.5" y="13" width="17" height="7" rx="3.5" /><circle cx="16.5" cy="7.5" r="1.6" class="dot" /><circle cx="7.5" cy="16.5" r="1.6" class="dot" /></svg>
        </button>
        <button class="pill clock" id="clock" title="Notifications and calendar"></button>
      </div>
    </div>
    <!-- The Cove menu, the app menu and Control Centre open in their own
         popover window (popover.html), sized to the popover. -->
    <script type="module" src="./src/topbar.ts"></script>
  </body>
</html>
