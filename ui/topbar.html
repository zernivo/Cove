<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cove Top Bar</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/chrome.css" />
    <link rel="stylesheet" href="./src/topbar.css" />
  </head>
  <body>
    <!-- Liquid Glass bar: an opaque base, the pre-frosted wallpaper plate
         (lined up with the screen, refracted on a thin edge band), the Ink
         or paper tint and a hairline. Never DWM acrylic: the bar window is
         never active, and Windows paints an inactive backdrop flat grey. -->
    <div class="glass" id="glass"><div class="plate" id="plate"></div><div class="tint"></div></div>
    <div class="bar">
      <div class="left" id="left">
        <button class="mark" id="mark" title="Cove" data-menu="cove"><img class="cove-logo" src="/cove-mark.png" alt="" draggable="false" /></button>
        <button class="title app" id="app" data-menu="app">Desktop</button>
        <span id="menus" class="menus"></span>
      </div>
      <div class="right">
        <button class="item" id="wifi-btn" title="Wi-Fi">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 6.1a9.4 9.4 0 0 1 12.8 0" /><path d="M3.9 8.5a6.1 6.1 0 0 1 8.2 0" /><path d="M6.2 10.9a2.8 2.8 0 0 1 3.6 0" /><circle cx="8" cy="13" r="0.9" class="solid" /></svg>
        </button>
        <button class="item" id="sound-btn" title="Sound">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="solid" d="M2.2 6h2.3l3.2-2.7v9.4L4.5 10H2.2z" /><path class="w1" d="M10 6.2a2.6 2.6 0 0 1 0 3.6" /><path class="w2" d="M11.9 4.4a5.2 5.2 0 0 1 0 7.2" /><path class="mx" d="M10.2 6.2l3.6 3.6M13.8 6.2l-3.6 3.6" /></svg>
        </button>
        <button class="item batt-item hidden" id="battery" title="Battery"><span class="batt"><span class="fill" id="batt-fill"></span></span></button>
        <button class="item" id="search" title="Cove Search (Alt+Space)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.6" /><path d="M10.2 10.2l3.9 3.9" /></svg>
        </button>
        <button class="item" id="control" title="Control Centre" data-menu="cc">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.4" width="13" height="4.8" rx="2.4" /><rect x="1.5" y="8.8" width="13" height="4.8" rx="2.4" /><circle cx="11.9" cy="4.8" r="1.25" class="solid" /><circle cx="4.1" cy="11.2" r="1.25" class="solid" /></svg>
        </button>
        <button class="clock" id="clock" title="Notifications and calendar"></button>
      </div>
    </div>
    <script type="module" src="./src/topbar.ts"></script>
  </body>
</html>
