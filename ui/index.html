<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cove</title>
    <link rel="stylesheet" href="./src/tokens.css" />
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="toolbar glass">
        <span class="brand">cove</span>
        <span class="tagline">Windows, made calm.</span>
      </header>
      <section class="content">
        <h1>Welcome to Cove</h1>

          <article class="card"><h2>Mac habits</h2><p>Alt+M, Alt+W, Alt+Q and more.</p></article>
          <article class="card"><h2>Dock + top bar</h2><p>Calm, magnifying, out of the way.</p></article>
          <article class="card"><h2>Cove Search</h2><p>One keyboard-first launcher.</p></article>
          <article class="card"><h2>Calm look</h2><p>Hide the clutter. Restore anytime.</p></article>
        </div>
        <p id="status" class="muted"></p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
