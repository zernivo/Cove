ShortDescription: Windows, made calm. A Mac-style dock, Spotlight search, Control Centre and Liquid Glass for Windows 11, fully reversible.
Description: |-
  Cove gives Windows 11 a calm, Mac-inspired desktop: a Liquid Glass dock with a status island,
  Spotlight-style Search (Alt+Space), Control Centre, Mac window buttons on hover, App Exposé,
  an app-grouped switcher, window snapping and a wallpaper gallery. It uses documented,
  per-user settings only, journals every change, and turning it off puts Windows back exactly.
