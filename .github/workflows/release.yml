name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          body=$(awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          body="${body}

          **Download:** the \`-setup.exe\` below. Not code-signed yet, so SmartScreen may ask: More info, then Run anyway."
          { echo "body<<COVE_EOF"; echo "$body"; echo "COVE_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cove ${{ github.ref_name }} (early preview)"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
